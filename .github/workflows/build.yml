# Note: In a yml each level is padded by 2 spaces
name: Flutter

on:
  # Runs this action when you push on master
  push:
    branches: ["main"]
  # Runs this when a PR against master is created
  pull_request:
    branches: ["main"]

jobs:
  Shopping_List_Workflow:
    # Available Options: windows-latest, ubuntu-latest, macos-latest
    # The choice of macos-latest is because we will be building for Android and iOS
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ./5 - shopping_list

    steps:
      # Clones the project on the machine
      - uses: actions/checkout@v4

      # Uncomment after checking if this is needed only for Firebase distribution
      # # Sets up java 11
      # - uses: actions/setup-java@v4
      #   with:
      #     distribution: 'zulu'
      #     java-version: '11'

      # Installs flutter and related dependency on this machine
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.22.2"
          # ^ Specify Flutter version

      # Fetches proj dependencies from pub
      - name: Install dependencies
        run: flutter pub get

      # Verifies if the dart code is formatted well
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        # --set-exit-if-changed stops execution if the any code is not well formatted
        # --output=none prints files which needs to be formatted

      # Checks for Symantic errors. Can be configured using analysis_options.yaml
      - name: Analyze project source
        run: flutter analyze --fatal-warnings
        # --fatal-warnings stops execution if any warnings are found

      # # Runs unit test
      # - name: Run tests
      #   run: flutter test

      # Create android apk
      - name: Build apk
        run: flutter build apk

      # Upload apk to Firebase distribution
      # - name: Upload apk to Firebase distribution
      #   uses: wzieba/Firebase-Distribution-Github-Action@v1.7.0
      #   with:
      #     appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
      #     serviceCredentialsFileContent: ${{ secrets.SERVICE_CREDENTIALS_FILE_CONTENT }}
      #     groups: all_testers
      #     file: build/app/outputs/flutter-apk/app-release.apk
